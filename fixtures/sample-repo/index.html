<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample Shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Sample Shop</h1>

      <section aria-labelledby="products-title">
        <h2 id="products-title">Products</h2>
        <ul id="products"></ul>
      </section>

      <section aria-labelledby="cart-title">
        <h2 id="cart-title">Cart</h2>
        <p id="cart-empty">Your cart is empty</p>
        <ul id="cart-lines"></ul>

        <form id="discount-form">
          <label for="discount-code">Discount code</label>
          <input id="discount-code" name="code" autocomplete="off" />
          <button type="submit">Apply</button>
        </form>
        <p id="discount-message" role="status"></p>

        <dl>
          <dt>Subtotal</dt>
          <dd id="subtotal">$0.00</dd>
          <dt>Discount</dt>
          <dd id="discount">$0.00</dd>
          <dt>Shipping</dt>
          <dd id="shipping">$0.00</dd>
          <dt>Total</dt>
          <dd id="total">$0.00</dd>
        </dl>
      </section>

      <section aria-labelledby="checkout-title">
        <h2 id="checkout-title">Checkout</h2>
        <form id="checkout-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="text" autocomplete="email" />
          <button type="submit" id="place-order" disabled>Place order</button>
        </form>
        <p id="order-confirmation" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
